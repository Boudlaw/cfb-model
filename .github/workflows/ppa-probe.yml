name: PPA week probe

# One-off diagnostic. Run it once from the Actions tab, read the log, then delete
# this file. It answers whether /ppa/teams treats `week` as a real point-in-time
# filter, which decides whether ppa can be backfilled or has to stay critical.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe /ppa/teams
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          cat > probe.py <<'EOF'
          """
          One-off probe: does CFBD /ppa/teams treat `week` as a real point-in-time filter?

          Three calls, identical but for the week parameter. excludeGarbageTime is held
          constant -- if it varies, the comparison means nothing.

          Reads CFBD_API_KEY from the environment. Prints a table and a verdict. Makes
          4 requests, well inside the free tier's 1,000/month.
          """
          import json, os, sys, urllib.request, urllib.error

          KEY = os.environ.get("CFBD_API_KEY", "").strip()
          if not KEY:
              sys.exit("CFBD_API_KEY is not set.")
          BASE = "https://api.collegefootballdata.com"
          TEAMS = ["Oklahoma", "Georgia", "Texas", "Alabama", "Ole Miss"]


          def get(params):
              qs = "&".join(f"{k}={v}" for k, v in params.items())
              url = f"{BASE}/ppa/teams?{qs}"
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {KEY}",
                                                         "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read().decode("utf-8")), None
              except urllib.error.HTTPError as e:
                  return None, f"HTTP {e.code}"
              except Exception as e:                                  # noqa: BLE001
                  return None, str(e)


          def idx(rows):
              return {r.get("team"): r for r in (rows or [])}


          def val(d, team, *path):
              r = d.get(team)
              for p in path:
                  r = (r or {}).get(p)
              return r


          base = {"year": 2026, "excludeGarbageTime": "true"}
          noweek, e0 = get(base)
          w3, e3 = get({**base, "week": 3})
          w4, e4 = get({**base, "week": 4})

          print(f"no-week : {('ERROR ' + e0) if e0 else str(len(noweek)) + ' rows'}")
          print(f"week=3  : {('ERROR ' + e3) if e3 else str(len(w3)) + ' rows'}")
          print(f"week=4  : {('ERROR ' + e4) if e4 else str(len(w4)) + ' rows'}")

          if e3 or e4:
              print("\nVERDICT: the endpoint REJECTS the week parameter.")
              print("         ppa is NOT backfillable. Keep it filed critical; a missed Tuesday is")
              print("         a permanent hole, exactly like lines.")
              sys.exit(0)
          if e0:
              sys.exit("baseline call failed; cannot compare")

          N, A, B = idx(noweek), idx(w3), idx(w4)
          print(f"\n{'team':12s} {'field':20s} {'no-week':>12} {'week=3':>12} {'week=4':>12}")
          for t in TEAMS:
              for label, path in (("offense.overall", ("offense", "overall")),
                                  ("offense.cumulative", ("offense", "cumulative"))):
                  print(f"{t:12s} {label:20s} {str(val(N,t,*path)):>12} "
                        f"{str(val(A,t,*path)):>12} {str(val(B,t,*path)):>12}")

          ov = ("offense", "overall")
          same_3_4 = all(val(A, t, *ov) == val(B, t, *ov) for t in TEAMS)
          same_4_n = all(val(B, t, *ov) == val(N, t, *ov) for t in TEAMS)
          cum_grows = all((val(A, t, "offense", "cumulative") or 0)
                          < (val(B, t, "offense", "cumulative") or 0) for t in TEAMS)

          print()
          if same_3_4 and same_4_n:
              print("VERDICT: the week parameter is IGNORED -- all three calls are identical.")
              print("         ppa is NOT backfillable. Keep it critical.")
          elif same_4_n and cum_grows:
              print("VERDICT: week is a CUMULATIVE-THROUGH filter. week=4 equals season-to-date,")
              print("         and week=3 cumulative is smaller. ppa IS backfillable --")
              print("         downgrade it to recoverable and backfill weeks 1-3.")
          elif not same_3_4:
              print("VERDICT: week changes the result but week=4 does not equal season-to-date.")
              print("         Likely a SINGLE-WEEK statistic rather than cumulative. Still")
              print("         backfillable, but it is a different metric from what we captured")
              print("         on 2026-09-24 -- do not mix the two in one column.")
          else:
              print("VERDICT: inconclusive -- read the table above by hand.")
          EOF
          python probe.py
