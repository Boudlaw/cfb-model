name: PPA week probe

# One-off diagnostic. Run it once from the Actions tab, read the verdict on the run
# Summary page, then delete this file. It answers whether /ppa/teams treats `week`
# as a real point-in-time filter, which decides whether ppa can be backfilled.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe /ppa/teams
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          cat > probe.py <<'PROBE_EOF'
          """
          One-off probe: does CFBD /ppa/teams treat `week` as a real point-in-time filter?

          Three calls, identical but for the week parameter. excludeGarbageTime is held
          constant -- if it varies, the comparison means nothing.

          Uses archive.cfbd_get(), the same request path the weekly archiver uses, so the
          User-Agent, key handling, retries and error reporting are the known-good ones.
          Makes 3 requests, well inside the free tier's 1,000/month.
          """
          import sys
          import archive

          TEAMS = ["Oklahoma", "Georgia", "Texas", "Alabama", "Ole Miss"]
          BASE = {"year": 2026, "excludeGarbageTime": "true"}


          def get(params):
              try:
                  data, _ = archive.cfbd_get("/ppa/teams", params)
                  return ({r.get("team"): r for r in data} if isinstance(data, list) else {}), None
              except Exception as e:                                  # noqa: BLE001
                  return {}, f"{type(e).__name__}: {e}"[:300]


          def val(d, team, *path):
              r = d.get(team)
              for p in path:
                  r = (r or {}).get(p)
              return r


          N, e0 = get(dict(BASE))
          A, e3 = get({**BASE, "week": 3})
          B, e4 = get({**BASE, "week": 4})

          print(f"no-week : {e0 or str(len(N)) + ' rows'}")
          print(f"week=3  : {e3 or str(len(A)) + ' rows'}")
          print(f"week=4  : {e4 or str(len(B)) + ' rows'}")

          if e0:
              print("\nBaseline call failed -- cannot compare. Fix this before reading anything else.")
              sys.exit(1)

          if e3 or e4:
              print("\nVERDICT: the endpoint REJECTS the week parameter.")
              print("         ppa is NOT backfillable. Keep it filed critical -- a missed")
              print("         Tuesday is a permanent hole, exactly like lines.")
              sys.exit(0)

          print(f"\n{'team':12s} {'field':20s} {'no-week':>12} {'week=3':>12} {'week=4':>12}")
          for t in TEAMS:
              for label, path in (("offense.overall", ("offense", "overall")),
                                  ("offense.cumulative", ("offense", "cumulative"))):
                  print(f"{t:12s} {label:20s} {str(val(N,t,*path)):>12} "
                        f"{str(val(A,t,*path)):>12} {str(val(B,t,*path)):>12}")

          ov = ("offense", "overall")
          same_3_4 = all(val(A, t, *ov) == val(B, t, *ov) for t in TEAMS)
          same_4_n = all(val(B, t, *ov) == val(N, t, *ov) for t in TEAMS)
          cum_grows = all((val(A, t, "offense", "cumulative") or 0)
                          < (val(B, t, "offense", "cumulative") or 0) for t in TEAMS)

          print()
          if same_3_4 and same_4_n:
              print("VERDICT: the week parameter is IGNORED -- all three calls are identical.")
              print("         ppa is NOT backfillable. Keep it critical.")
          elif same_4_n and cum_grows:
              print("VERDICT: week is a CUMULATIVE-THROUGH filter. week=4 equals season-to-date,")
              print("         and week=3 cumulative is smaller. ppa IS backfillable --")
              print("         downgrade it to recoverable and backfill weeks 1-3.")
          elif not same_3_4:
              print("VERDICT: week changes the result but week=4 does not equal season-to-date.")
              print("         Likely a SINGLE-WEEK statistic rather than cumulative. Still")
              print("         backfillable, but a different metric from the 2026-09-24 capture")
              print("         -- do not mix the two in one column.")
          else:
              print("VERDICT: inconclusive -- read the table above by hand.")
          PROBE_EOF
          set +e
          python probe.py > out.txt 2>&1
          cat out.txt
          {
            echo "## PPA week probe"
            echo
            echo '```'
            cat out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
